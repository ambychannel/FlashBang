name: Release FlashBang

permissions:
  contents: write

# Every push to main publishes a new version, so Dalamud picks up updates on its own.
on:
  push:
    branches:
    - main
    paths-ignore:
    - 'repo.json'
    - '**.md'
    - 'relay/**'
  workflow_dispatch:
    inputs:
      testing:
        description: Publish as a testing release
        type: boolean
        required: false
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      VERSION: 0.1.0.${{ github.run_number }}

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: true

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Download Dalamud
      run: |
        Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/stg/latest.zip -OutFile latest.zip
        Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

    - name: Restore Dependencies
      run: dotnet restore Brio.slnx

    - name: Build FlashBang
      run: dotnet build Brio.slnx --no-restore /p:Configuration=Release /p:Version=${{ env.VERSION }}

    - name: Zip Release
      uses: TheDoctor0/zip-release@0.6.0
      with:
        filename: '../../../../FlashBang.zip'
        directory: './Brio/bin/x64/Release/'
        exclusions: 'FlashBang FlashBang/*'

    - name: Upload Release
      uses: ncipollo/release-action@v1
      with:
        allowUpdates: true
        artifacts: "./FlashBang.zip"
        name: FlashBang v${{ env.VERSION }}
        tag: v${{ env.VERSION }}
        draft: false
        prerelease: ${{ github.event.inputs.testing == 'true' }}
        token: ${{ secrets.GITHUB_TOKEN }}
        commit: ${{ github.sha }}

    - name: Update repo.json
      uses: ./.github/actions/update-repo
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        version: ${{ env.VERSION }}
        testing: ${{ github.event.inputs.testing || 'false' }}
